<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History | Yashmart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ======================
   🌍 PAGE BASE
====================== */
body {
  background: #f4f0ff;
  font-family: Arial, sans-serif;
}

/* ======================
   💜 YASHMART BRAND
====================== */
.luxury-purple {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1.2px;
  background: linear-gradient(90deg,#5a189a,#9d4edd,#c77dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 8px rgba(157,78,221,.35);
}

/* ======================
   🧭 NAVBAR
====================== */
.navbar {
  background: linear-gradient(135deg,#3f1651,#5a1f6f);
}

.navbar .btn {
  background: #ffffff;
  color: #3f1651;
  font-weight: 600;
}

/* ======================
   📦 ORDER CARD (SMALL)
====================== */
.order-card {
  max-width: 420px;
  margin: 0 auto 10px;
  border-radius: 12px;
  border-left: 4px solid #8e44ad;
  background: linear-gradient(145deg,#ffffff,#f7eefe);
  box-shadow: 0 6px 14px rgba(142,68,173,.25);
}

.order-card .card-body {
  padding: 10px 12px;
}

/* Header */
.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
}

/* Status badges */
.badge-placed { background:#facc15; color:#000; }
.badge-shipped { background:#38bdf8; color:#000; }
.badge-delivered { background:#22c55e; }

/* View button */
.view-btn {
  width: 100%;
  margin-top: 6px;
  border-radius: 20px;
  border: none;
  font-size: 11px;
  padding: 4px;
  background: linear-gradient(135deg,#8e44ad,#c084fc);
  color: #fff;
}

/* Details hidden */
.order-details {
  display: none;
  font-size: 11px;
  margin-top: 6px;
}
.order-details.open {
  display: block;
}

.order-details p {
  margin-bottom: 2px;
}

.order-details ul {
  padding-left: 16px;
  margin-bottom: 4px;
}

/* Buttons */
.order-details .btn {
  font-size: 11px;
  padding: 4px 8px;
}

/* Desktop – SAME AS MOBILE */
@media (min-width: 768px) {
  .order-card {
    max-width: 420px;
  }
}
/* 💜 YASHMART BRAND – SMALLER LOGO */
.luxury-purple {
  font-size: 18px;          /* ⬅️ reduced from 24px */
  font-weight: 900;
  letter-spacing: 1px;      /* slightly tighter */
  background: linear-gradient(
    90deg,
    #5a189a,
    #9d4edd,
    #c77dff
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 1px 6px rgba(157, 78, 221, 0.35);
}
@media (max-width: 576px) {
  .luxury-purple {
    font-size: 16px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand luxury-purple" href="webpage1.html">YASH-MART</a>
    <a class="btn btn-sm" href="cart.html">Cart</a>
  </div>
</nav>

<div class="container my-4 order-history">
  <h6 class="text-center fw-bold mb-3" style="color:#3f1651">📦 Your Orders</h6>
  <div id="ordersContainer"></div>

  <div class="text-center mt-3">
    <button class="btn btn-outline-danger btn-sm" onclick="clearOrders()">Clear Orders</button>
  </div>
</div>

<script>
const ordersContainer = document.getElementById("ordersContainer");
let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.forEach(o=>{
  if(!o.status)o.status="Placed";
});
localStorage.setItem("orders",JSON.stringify(orders));

if(!orders.length){
  ordersContainer.innerHTML='<p class="text-center text-danger">No orders found</p>';
}else{
  [...orders].reverse().forEach((order,i)=>{
    const badge =
      order.status==="Delivered"?"badge-delivered":
      order.status==="Shipped"?"badge-shipped":"badge-placed";

    const items = order.items.map(it=>`<li>${it.name} × ${it.quantity}</li>`).join("");

    ordersContainer.innerHTML+=`
    <div class="card order-card">
      <div class="card-body">

        <div class="order-header">
          <span>${order.id}</span>
          <span class="badge ${badge}">${order.status}</span>
          <strong>${order.total}</strong>
        </div>

        <button class="view-btn"
          onclick="this.nextElementSibling.classList.toggle('open')">
          View Details
        </button>

        <div class="order-details">
          <p><b>Date:</b> ${order.date}</p>
          <p><b>Name:</b> ${order.customer.name}</p>
          <p><b>Phone:</b> ${order.customer.phone}</p>
          <p><b>Address:</b> ${order.customer.address}</p>

          <ul>${items}</ul>

          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-outline-primary btn-sm"
              onclick='reorder(${JSON.stringify(order.items)})'>Reorder</button>
            ${order.status!=="Delivered"?
            `<button class="btn btn-outline-danger btn-sm"
              onclick="cancelOrder(${i})">Cancel</button>`:""}
          </div>
        </div>

      </div>
    </div>`;
  });
}

function reorder(items){
  localStorage.setItem("cart",JSON.stringify(items));
  location.href="cart.html";
}
function cancelOrder(index){
  if(confirm("Cancel order?")){
    orders[index].status = "Cancelled";
    localStorage.setItem("orders", JSON.stringify(orders));
    location.reload();
  }
}
function clearOrders(){
  if(confirm("Clear all orders?")){
    localStorage.removeItem("orders");
    location.reload();
  }
}
</script>

</body>
</html>
