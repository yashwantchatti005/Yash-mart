<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Yashmart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg" href="cart-dash.svg">
<link rel="stylesheet" href="wepsite.css">

<style>
body { background:#f8f9fa; }

/* Card */
.card {
  transition: .3s;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* Price summary */
.price-box {
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 12px 28px rgba(106,17,203,.18);
}
.price-box p {
  display:flex;
  justify-content:space-between;
}
.price-box h5 {
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

/* Sticky summary */
@media (min-width:992px){
  .price-wrapper {
    position:sticky;
    top:90px;
  }
}

/* Empty cart */
.empty-cart {
  text-align:center;
  padding:40px;
}

/* Progress */
.progress { height:22px; }

/* Van animation */
.van-container { height:120px; overflow:hidden; }
.van {
  width:140px;
  position:absolute;
  animation: drive 2s linear infinite;
}
@keyframes drive {
  from { left:-160px }
  to { left:110% }
}
/* ==============================
   💜 YASHMART CART – PREMIUM UI
============================== */

/* Page */
body {
  background: linear-gradient(135deg, #f4f0ff, #fdfbff);
}

/* Navbar */
.navbar {
  background: linear-gradient(135deg, #3f1651, #6a11cb) !important;
  box-shadow: 0 6px 20px rgba(106,17,203,.35);
}

.navbar-brand {
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(90deg,#c77dff,#9d4edd,#5a189a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Navbar buttons */
.navbar .btn {
  border-radius: 20px;
  font-weight: 600;
}

/* ==============================
   🛒 CART CARDS
============================== */

.card {
  border-radius: 18px;
  border: none;
  background: linear-gradient(145deg,#ffffff,#f6f1ff);
  box-shadow: 0 12px 28px rgba(155,92,255,.18);
  transition: all .35s ease;
}

.card:hover {
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 20px 45px rgba(155,92,255,.35);
}

/* Product image */
.card-img-top {
  height: 180px;
  object-fit: contain;
  padding: 12px;
  background: #fff;
}

/* Product text */
.card h6 {
  font-weight: 700;
  color: #3f1651;
}

.card p {
  font-weight: 700;
  color: #8e44ad;
}

/* Quantity buttons */
.card .btn-outline-secondary {
  border-radius: 50%;
  width: 32px;
  height: 32px;
  padding: 0;
}

/* Remove button */
.card .btn-danger {
  border-radius: 18px;
  font-size: 12px;
}

/* ==============================
   💰 PRICE SUMMARY BOX
============================== */

.price-box {
  background: linear-gradient(145deg,#ffffff,#f6f1ff);
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 18px 40px rgba(106,17,203,.25);
}

.price-box h5 {
  font-size: 20px;
  color: #3f1651;
}

/* Coupon input */
#couponInput {
  border-radius: 20px;
  border: 1px solid #d8b4e2;
}

.price-box .btn-primary {
  background: linear-gradient(135deg,#6a11cb,#9b5cff);
  border-radius: 22px;
  font-weight: 700;
}

.price-box .btn-primary:hover {
  box-shadow: 0 0 16px rgba(155,92,255,.6);
}

/* Checkout button */
.price-box .btn-success {
  background: linear-gradient(135deg,#22c55e,#16a34a);
  border-radius: 22px;
  font-weight: 800;
}

/* Clear cart */
.price-box .btn-danger {
  border-radius: 22px;
}

/* ==============================
   🚚 DELIVERY PROGRESS
============================== */

.progress {
  height: 16px;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  background: linear-gradient(90deg,#6a11cb,#c77dff);
  font-weight: 700;
}

/* ==============================
   🛍 EMPTY CART
============================== */

.empty-cart {
  background: linear-gradient(145deg,#ffffff,#f6f1ff);
  border-radius: 20px;
  padding: 50px;
  box-shadow: 0 12px 30px rgba(155,92,255,.2);
}

.empty-cart h5 {
  color: #3f1651;
}

/* ==============================
   📱 MOBILE TWEAKS
============================== */

@media (max-width: 768px) {
  .card-img-top {
    height: 150px;
  }

  .price-box {
    margin-top: 20px;
  }
}
/* =====================================================
   🛒 CART CARDS – CLEAN & SIMPLE (FINAL FIX)
===================================================== */

/* RESET everything for cart cards */
#cartContainer .card {
  background: #ffffff !important;
  border-radius: 12px !important;
  border: 1px solid #e5e7eb !important;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08) !important;
  transform: none !important;
  transition: box-shadow 0.25s ease !important;
}

/* Simple hover (NO zoom) */
#cartContainer .card:hover {
  transform: none !important;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12) !important;
}

/* Image – clean & same as products */
#cartContainer .card-img-top {
  height: 180px !important;
  object-fit: contain !important;
  padding: 10px !important;
  background: #ffffff !important;
}

/* Product name */
#cartContainer .card h6 {
  font-size: 15px !important;
  font-weight: 600 !important;
  color: #111827 !important;
  margin-bottom: 4px;
}

/* Price */
#cartContainer .card p {
  font-size: 14px !important;
  font-weight: 700 !important;
  color: #16a34a !important;
  margin-bottom: 6px;
}

/* Quantity controls – normal */
#cartContainer .btn-outline-secondary {
  border-radius: 6px !important;
  padding: 2px 8px !important;
  font-size: 14px !important;
}

/* Quantity input */
#cartContainer input[type="number"] {
  height: 30px;
  font-size: 14px;
}

/* Remove button – simple */
#cartContainer .btn-danger {
  border-radius: 8px !important;
  font-size: 12px !important;
  padding: 4px 10px !important;
}

===================================================== */

#cartContainer .card {

}
/* =====================================
   🚫 REMOVE NUMBER INPUT ARROWS (CART)
===================================== */

/* Chrome, Edge, Safari */
#cartContainer input[type="number"]::-webkit-inner-spin-button,
#cartContainer input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Firefox */
#cartContainer input[type="number"] {
  -moz-appearance: textfield;
}
/* =====================================
   📱 NAVBAR – FORCE SINGLE LINE (MOBILE)
===================================== */

.navbar .container-fluid {
  flex-wrap: nowrap !important;
}

.navbar-brand {
  font-size: 16px;          /* smaller logo for mobile */
  white-space: nowrap;     /* prevent breaking */
}

@media (max-width: 576px) {
  .navbar .btn {
    padding: 4px 8px;
    font-size: 12px;
  }
}
/* 🚫 Disable hover animation for BIG CART CARD */
#cartContainer > .col-12 > .card:hover {
  transform: none !important;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08) !important;
}
#cartContainer {
  scroll-behavior: smooth;
}
/* 🧾 Make BIG CART CARD scrollable */
#cartContainer > .col-12 > .card {
  max-height: 480px;        /* control height */
  overflow-y: auto;         /* enable vertical scroll */
  overflow-x: hidden;
}

/* Smooth scrolling inside cart */
#cartContainer > .col-12 > .card {
  scroll-behavior: smooth;
}

/* Optional: clean scrollbar (Chrome / Edge) */
#cartContainer > .col-12 > .card::-webkit-scrollbar {
  width: 6px;
}

#cartContainer > .col-12 > .card::-webkit-scrollbar-thumb {
  background: #9b5cff;
  border-radius: 10px;
}

#cartContainer > .col-12 > .card::-webkit-scrollbar-track {
  background: #f1f1f1;
}
/* Scrollable cart cards */
.cart-scroll {
  max-height: 320px;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Scrollbar */
.cart-scroll::-webkit-scrollbar {
  width: 6px;
}
.cart-scroll::-webkit-scrollbar-thumb {
  background: #9b5cff;
  border-radius: 10px;
}
.cart-scroll::-webkit-scrollbar-track {
  background: #f1f1f1;
}
/* ===============================
   📱 MOBILE CART SPACING FIX
================================ */
@media (max-width: 576px) {

  /* Reduce card height for mobile */
  .cart-scroll {
    max-height: 260px;
    padding: 12px !important;
  }

  /* Section headings */
  .cart-scroll h5 {
    font-size: 16px;
    margin-bottom: 8px;
  }

  /* Each cart item row */
  .cart-scroll .d-flex.align-items-center.justify-content-between {
    flex-direction: column;
    align-items: flex-start !important;
    gap: 8px;
  }

  /* Image + name row */
  .cart-scroll .d-flex.align-items-center.gap-3 {
    gap: 10px;
  }

  /* Product name */
  .cart-scroll .fw-semibold {
    font-size: 14px;
  }

  /* Price */
  .cart-scroll .text-success {
    font-size: 13px;
  }

  /* Buttons row */
  .cart-scroll .d-flex.align-items-center.gap-2 {
    width: 100%;
    justify-content: space-between;
  }

  /* Quantity buttons */
  .cart-scroll .btn-outline-secondary {
    padding: 4px 10px;
    font-size: 14px;
  }

  /* Remove button */
  .cart-scroll .btn-danger {
    padding: 4px 10px;
    font-size: 12px;
  }

  /* Quantity box */
  .cart-scroll input {
    width: 42px !important;
    height: 30px;
    font-size: 14px;
  }

  /* Overall spacing between cards */
  #cartContainer .col-12 {
    margin-bottom: 14px;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid d-flex align-items-center justify-content-between flex-nowrap">

    <!-- LOGO -->
    <a class="navbar-brand luxury-purple mb-0" href="webpage1.html">
      YASH-MART
    </a>

    <!-- ACTION BUTTONS -->
    <div class="d-flex align-items-center gap-2 flex-nowrap">
      <a href="Orders.html" class="btn btn-outline-info btn-sm">
        📦 Orders
      </a>
<a href="webpage1.html" class="btn btn-outline-light btn-sm">
  🛒
</a>

    </div>

  </div>
</nav>



<div class="container my-4">
  <h3 class="text-center mb-4">🛒 Your Shopping Cart</h3>

  <div class="row">
    <!-- CART ITEMS -->
    <div class="col-lg-8">
      <div id="cartContainer" class="row g-3"></div>

      <!-- DELIVERY PROGRESS -->
      <div class="mt-4">
        <div class="progress">
          <div id="progressBar" class="progress-bar bg-success">0%</div>
        </div>
        <p id="deliveryMsg" class="fw-bold text-center mt-2"></p>
        <p id="deliveryDate" class="text-muted text-center"></p>
      </div>
    </div>

    <!-- PRICE SUMMARY -->
    <div class="col-lg-4 price-wrapper">
      <div class="price-box">
        <p>Subtotal <span id="subtotalPrice">₹0</span></p>
        <p>Discount <span id="discountPrice">₹0</span></p>
        <p>Delivery <span class="text-success">FREE</span></p>
        <hr>
        <h5>Grand Total <span id="grandTotal">₹0</span></h5>

        <!-- Coupon -->
        <div class="mt-3">
          <input id="couponInput" class="form-control mb-2" placeholder="Coupon code">
          <button class="btn btn-primary w-100" onclick="applyCoupon()">Apply Coupon</button>
          <p id="couponMsg" class="fw-bold mt-2"></p>
        </div>

        <p id="youSaved" class="fw-bold text-success mt-2"></p>

        <!-- Buttons -->
        <button class="btn btn-success w-100 mt-2" onclick="checkout()">Checkout</button>
        <button class="btn btn-danger w-100 mt-2" onclick="clearCart()">Clear Cart</button>

        <!-- Trust -->
        <p class="text-muted text-center small mt-3">
          🔒 Secure Payments | COD • UPI • Wallets
        </p>
      </div>
    </div>
  </div>
</div>

<!-- ADDRESS MODAL -->
<div class="modal fade" id="addressModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Delivery Details</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="orderForm">
          <input class="form-control mb-2" placeholder="Full Name" required>
          <input class="form-control mb-2" placeholder="Phone Number" required>
          <textarea class="form-control mb-2" placeholder="Address" required></textarea>
             <select class="form-select mb-3" required>
            <option value="">Payment Method</option>
            <option>Cash on Delivery</option>
            <option>UPI</option>
          </select>

          <button class="btn btn-dark w-100">Place Order</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- SUCCESS -->
<div class="modal fade" id="successModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-body">
        <div class="van-container position-relative">
          <img src="Images/van.gif" class="van">
        </div>
        <h5 class="text-success mt-3">🎉 Order Placed Successfully!</h5>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================
   🛒 CART LOGIC – FINAL FIX
========================= */

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let appliedCoupon = "";

/* DOM refs */
const cartContainer = document.getElementById("cartContainer");
const subtotalPrice = document.getElementById("subtotalPrice");
const discountPrice = document.getElementById("discountPrice");
const grandTotal = document.getElementById("grandTotal");
const progressBar = document.getElementById("progressBar");
const deliveryMsg = document.getElementById("deliveryMsg");
const deliveryDate = document.getElementById("deliveryDate");
const youSaved = document.getElementById("youSaved");

const addressModal = new bootstrap.Modal(document.getElementById("addressModal"));
const successModal = new bootstrap.Modal(document.getElementById("successModal"));

/* Delivery date */
const d = new Date();
d.setDate(d.getDate() + 3);
deliveryDate.innerText = "📦 Delivery by " + d.toDateString();

/* =========================
   DISPLAY CART
========================= */
function displayCart() {
  cartContainer.innerHTML = "";
  let total = 0;

  if (!cart.length) {
    cartContainer.innerHTML = `
      <div class="empty-cart">
        <h5>Your cart is empty</h5>
        <a href="webpage1.html" class="btn btn-primary mt-2">Shop Now</a>
      </div>`;
    subtotalPrice.innerText = discountPrice.innerText = grandTotal.innerText = "₹0";
    progressBar.style.width = "0%";
    progressBar.innerText = "0%";
    deliveryMsg.innerText = "";
    return;
  }

  const cafeItems = cart.filter(i => i.category?.toLowerCase() === "cafe");
  const otherItems = cart.filter(i => i.category?.toLowerCase() !== "cafe");

  /* ================= ITEMS CARD ================= */
  if (otherItems.length) {
    let itemsHTML = "";
    otherItems.forEach(item => {
      item.quantity ||= 1;
      total += item.price * item.quantity;
      const index = cart.indexOf(item);

      itemsHTML += `
        <div class="d-flex align-items-center justify-content-between border rounded p-2 mb-2">
          <div class="d-flex align-items-center gap-3">
            <img src="${item.image}" width="60" height="60" class="rounded">
            <div>
              <div class="fw-semibold">${item.name}</div>
              <div class="text-success fw-bold">₹${item.price}</div>
            </div>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${index},-1)">−</button>
            <input type="text" value="${item.quantity}" class="form-control text-center" style="width:45px" readonly>
            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${index},1)">+</button>
            <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">✕</button>
          </div>
        </div>`;
    });

    cartContainer.innerHTML += `
      <div class="col-12 mb-3">
        <div class="card p-3 cart-scroll">
          <h5 class="fw-bold">🛍 Items</h5>
          <hr>
          ${itemsHTML}
        </div>
      </div>`;
  }

  /* ================= CAFE CARD ================= */
  if (cafeItems.length) {
    let cafeHTML = "";
    cafeItems.forEach(item => {
      item.quantity ||= 1;
      total += item.price * item.quantity;
      const index = cart.indexOf(item);

      cafeHTML += `
        <div class="d-flex align-items-center justify-content-between border rounded p-2 mb-2">
          <div class="d-flex align-items-center gap-3">
            <img src="${item.image}" width="60" height="60" class="rounded">
            <div>
              <div class="fw-semibold">${item.name}</div>
              <div class="text-success fw-bold">₹${item.price}</div>
            </div>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${index},-1)">−</button>
            <input type="text" value="${item.quantity}" class="form-control text-center" style="width:45px" readonly>
            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${index},1)">+</button>
            <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">✕</button>
          </div>
        </div>`;
    });

    cartContainer.innerHTML += `
      <div class="col-12">
        <div class="card p-3 cart-scroll">
          <h5 class="fw-bold">☕ Cafe Items</h5>
          <hr>
          ${cafeHTML}
        </div>
      </div>`;
  }

  /* ================= TOTALS ================= */
  let discount = appliedCoupon === "WELCOME10" ? total * 0.1 : 0;
  let final = total - discount;

  subtotalPrice.innerText = "₹" + total;
  discountPrice.innerText = "-₹" + Math.floor(discount);
  grandTotal.innerText = "₹" + Math.floor(final);
  youSaved.innerText = discount ? `🎉 You saved ₹${Math.floor(discount)}` : "";

  let percent = Math.min((total / 499) * 100, 100);
  progressBar.style.width = percent + "%";
  progressBar.innerText = Math.floor(percent) + "%";
  deliveryMsg.innerText =
    total >= 499 ? "🎉 Free Delivery!" : `Add ₹${499 - total} more`;
}


/* =========================
   ACTIONS
========================= */
function changeQty(i, d) {
  if (!cart[i]) return;
  cart[i].quantity = Math.max(1, cart[i].quantity + d);
  localStorage.setItem("cart", JSON.stringify(cart));
  displayCart();
}

function removeItem(i) {
  cart.splice(i, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  displayCart();
}

function clearCart() {
  if (confirm("Clear cart?")) {
    localStorage.removeItem("cart");
    cart = [];
    displayCart();
  }
}

function applyCoupon() {
  const c = document.getElementById("couponInput").value.trim();
  appliedCoupon = c === "WELCOME10" ? c : "";
  displayCart();
}

function checkout() {
  if (!cart.length) return alert("Cart empty!");
  addressModal.show();
}

/* =========================
   PLACE ORDER
========================= */
document.getElementById("orderForm").onsubmit = (e) => {
  e.preventDefault();

  const inputs = e.target.querySelectorAll("input, textarea");
  const payment = e.target.querySelector("select");

  const order = {
    id: "ORD" + Date.now(),
    date: new Date().toLocaleString(),
    total: grandTotal.innerText,
    status: "Placed",
    customer: {
      name: inputs[0].value,
      phone: inputs[1].value,
      address: inputs[2].value
    },
    payment: payment.value,
    items: cart
  };

  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  orders.push(order);
  localStorage.setItem("orders", JSON.stringify(orders));

  addressModal.hide();
  successModal.show();

  setTimeout(() => {
    successModal.hide();
    localStorage.removeItem("cart");
    cart = [];
    displayCart();
  }, 2000);
};

/* INIT */
displayCart();
</script>


</body>
</html>
